name: Document report preview
on:
  pull_request:
    paths:
      - 'src/aegislog/report_document.py'
      - 'tools/report-layout/document_preview.py'
      - 'tools/report-layout/check_document_preview.cjs'
      - '.github/workflows/document-report-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-sample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate from synthetic log analysis
        run: |
          python -m pip install --require-hashes -r packaging/runtime-lock.txt
          PYTHONPATH=src python tools/report-layout/document_preview.py
      - name: Verify browser and print presentation
        run: |
          npm install --no-save --prefix /tmp/aegis-report-browser playwright@1.56.1
          /tmp/aegis-report-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
          NODE_PATH=/tmp/aegis-report-browser/node_modules node tools/report-layout/check_document_preview.cjs
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          path = 'report-layout-qa/document-preview/AegisLog-Document-Report-Preview.pdf'
          info = subprocess.check_output(['pdfinfo', path], text=True)
          pages = int(re.search(r'Pages:\s+(\d+)', info).group(1))
          assert pages == 3, f'Unexpected sample length: {pages}'
          text = subprocess.check_output(['pdftotext', path, '-'], text=True)
          for required in ['SYNTHETIC DEMO DATA', '6 failed logins need account review', '117', 'F-001', 'F-002', 'F-003', 'F-004', 'Technical appendix', 'MADE BY HR-PRESENTS']:
              assert required in text, f'Missing printed content: {required}'
          for page in range(1, pages+1):
              content = subprocess.check_output(['pdftotext','-f',str(page),'-l',str(page),path,'-'],text=True)
              assert re.search(rf'{page}\s*/\s*{pages}',content), 'Missing page number'
          subprocess.run(['pdftoppm','-scale-to','1300','-png',path,'report-layout-qa/document-preview/page'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegislog-document-design-preview
          path: report-layout-qa/document-preview/
