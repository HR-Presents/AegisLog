name: Verify beginner demo pack

on:
  pull_request:
    paths:
      - 'docs/demo/**'
      - 'tools/build_demo_pack.py'
      - '.github/workflows/demo-pack.yml'
  push:
    branches: [main]
    paths:
      - 'docs/demo/**'
      - 'tools/build_demo_pack.py'
      - '.github/workflows/demo-pack.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install published runtime with locked dependencies
        run: |
          python -m pip install --require-hashes -r packaging/runtime-lock.txt
          python -m pip install --no-deps "https://github.com/HR-Presents/AegisLog/releases/download/v2.1.11/aegislog_ai-2.1.11-py3-none-any.whl"
      - name: Verify expectations, reports, source preservation and ZIP
        run: python tools/build_demo_pack.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-beginner-demo
          path: out/demo/*
          retention-days: 7
  prepare-download-blob:
    if: github.repository == 'HR-Presents/AegisLog' && github.event_name == 'push'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-beginner-demo
          path: out/demo
      - name: Prepare verified binary Git object for a reviewed follow-up commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          blob_sha="$(gh api --method POST repos/HR-Presents/AegisLog/git/blobs --input out/demo/blob.json --jq '.sha')"
          echo "DEMO_BLOB_SHA=$blob_sha"
          cat out/demo/AegisLog-First-Investigation-Demo.zip.sha256
