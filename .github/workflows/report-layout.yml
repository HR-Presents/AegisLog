name: Folder report print layout
on:
  pull_request:
    paths:
      - 'src/aegislog/folder_scan.py'
      - 'src/aegislog/reporting.py'
      - 'src/aegislog/report_design.py'
      - 'src/aegislog/report_reference.py'
      - 'src/aegislog/report_styles.py'
      - 'tools/report-layout/**'
      - '.github/workflows/report-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-print:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate synthetic folder report
        run: |
          python -m pip install --require-hashes -r packaging/runtime-lock.txt
          PYTHONPATH=src python tools/report-layout/generate_fixture.py
      - name: Render and exercise the report in Chromium
        run: |
          npm install --no-save --prefix /tmp/aegis-report-browser playwright@1.56.1
          /tmp/aegis-report-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
          NODE_PATH=/tmp/aegis-report-browser/node_modules node tools/report-layout/check_print.cjs
          pdfinfo report-layout-qa/folder-overview.pdf
          pdftotext -layout report-layout-qa/folder-overview.pdf report-layout-qa/print.txt
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          info = subprocess.check_output(['pdfinfo', 'report-layout-qa/folder-overview.pdf'], text=True)
          pages = int(re.search(r'Pages:\s+(\d+)', info).group(1))
          assert 2 <= pages <= 20, f'Unexpected 161-source print length: {pages}'
          text = Path('report-layout-qa/print.txt').read_text()
          assert '145 unique sources analyzed + 16 duplicate copies' in text
          assert '938 operational issues' in text
          assert 'Source appendix' in text and 'Identical to' in text
          assert 'Filter sources' not in text and 'Open report' not in text
          assert 'duplicate-copy-015' in text, 'Last source missing from print'
          for name in ['demo-summary', 'demo-complete', 'demo-complete-no-background']:
              contents = subprocess.check_output(['pdftotext', f'report-layout-qa/{name}.pdf', '-'], text=True)
              assert 'SYNTHETIC DEMO DATA' in contents
              info = subprocess.check_output(['pdfinfo', f'report-layout-qa/{name}.pdf'], text=True)
              count = int(re.search(r'Pages:\s+(\d+)', info).group(1))
              for page in range(1, count + 1):
                  page_text = subprocess.check_output(['pdftotext', '-f', str(page), '-l', str(page), f'report-layout-qa/{name}.pdf', '-'], text=True)
                  assert re.search(rf'{page}\s*/\s*{count}', page_text), 'Missing page number'

              first_page = subprocess.check_output(['pdftotext', '-f', '1', '-l', '1', f'report-layout-qa/{name}.pdf', '-'], text=True)
              assert 'PRESENTED BY HR-PRESENTS' in first_page and 'Report ID' in first_page
              assert 'Record formats' in first_page and 'Generated' in first_page
              assert 'Executive Summary' in first_page, 'Results missing from opening page'
              assert 'Contents' in contents and 'Record Overview' in contents
              assert 'Timestamp limitations:' in contents
              assert count <= (6 if name == 'demo-summary' else 10), f'Unexpected demo print length: {name} {count}'
              if name != 'demo-summary':
                  page_texts = [' '.join(subprocess.check_output(['pdftotext', '-f', str(p), '-l', str(p), f'report-layout-qa/{name}.pdf', '-'], text=True).split()) for p in range(1, count + 1)]
                  incident_page = next(p for p in page_texts if 'Incident Queue' in p and 'Grouped signals; validate shared cause and timing.' in p)
                  assert 'counts may exceed retained excerpts' in incident_page, 'Incident explanation split'
                  assert 'INC-5E581024' in incident_page, 'Incident heading separated from rows'
                  anomaly_page = next(p for p in page_texts if 'Anomaly Signals' in p and 'Scores describe rare concerning event classes' in p)
                  assert 'No rare concerning event classes were recorded' in anomaly_page, 'Anomaly results split'
              if name == 'demo-summary':
                  assert 'SUMMARY ONLY' in contents
              else:
                  assert 'F-001' in contents and 'F-002' in contents
          for name in ['empty', 'missing-time', 'many-findings', 'windows-context', 'wer-application']:
              report = f'report-layout-qa/{name}.pdf'
              contents = subprocess.check_output(['pdftotext', report, '-'], text=True)
              assert 'Print summary / Save PDF' not in contents, f'{name}: screen controls in PDF'
              info = subprocess.check_output(['pdfinfo', report], text=True)
              count = int(re.search(r'Pages:\s+(\d+)', info).group(1))
              for page in range(1, count + 1):
                  page_text = subprocess.check_output(['pdftotext', '-f', str(page), '-l', str(page), report, '-'], text=True)
                  assert re.search(rf'{page}\s*/\s*{count}', page_text), f'{name}: missing page number'
              assert 'Coverage' in contents, f'{name}: coverage lost'
              if name == 'windows-context':
                  assert 'Microsoft-Windows-DistributedCOM' in contents
                  assert '2/123 total events' in contents
                  assert 'sample rarity' in contents
              if name == 'wer-application':
                  assert count <= 6, f'Diagnostic summary too long: {count} pages'
                  assert 'Windows kernel live-dump report recorded' in contents
                  assert 'Edge updater diagnostic report recorded' in contents
                  assert 'not counts of unique failures' in contents
                  assert 'Event ID 1001' in contents
          print(f'Printed {pages} readable appendix pages for 161 long-path sources')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: folder-report-print-review
          path: report-layout-qa/

