name: Folder report print layout
on:
  pull_request:
    paths:
      - 'src/aegislog/folder_scan.py'
      - 'src/aegislog/reporting.py'
      - 'src/aegislog/report_design.py'
      - 'tools/report-layout/**'
      - '.github/workflows/report-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-print:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate synthetic folder report
        run: |
          python -m pip install --require-hashes -r packaging/runtime-lock.txt
          PYTHONPATH=src python tools/report-layout/generate_fixture.py
      - name: Render and exercise the report in Chromium
        run: |
          npm install --no-save --prefix /tmp/aegis-report-browser playwright@1.56.1
          /tmp/aegis-report-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
          NODE_PATH=/tmp/aegis-report-browser/node_modules node tools/report-layout/check_print.cjs
          pdfinfo report-layout-qa/folder-overview.pdf
          pdftotext -layout report-layout-qa/folder-overview.pdf report-layout-qa/print.txt
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          info = subprocess.check_output(['pdfinfo', 'report-layout-qa/folder-overview.pdf'], text=True)
          pages = int(re.search(r'Pages:\s+(\d+)', info).group(1))
          assert 2 <= pages <= 20, f'Unexpected 161-source print length: {pages}'
          text = Path('report-layout-qa/print.txt').read_text()
          assert '145 unique sources analyzed + 16 duplicate copies' in text
          assert '938 operational issues' in text
          assert 'Source appendix' in text and 'Identical to' in text
          assert 'Filter sources' not in text and 'Open report' not in text
          assert 'duplicate-copy-015' in text, 'Last source missing from print'
          for name in ['demo-summary', 'demo-complete']:
              contents = subprocess.check_output(['pdftotext', f'report-layout-qa/{name}.pdf', '-'], text=True)
              assert 'SYNTHETIC DEMO DATA' in contents
              info = subprocess.check_output(['pdfinfo', f'report-layout-qa/{name}.pdf'], text=True)
              count = int(re.search(r'Pages:\s+(\d+)', info).group(1))
              for page in range(1, count + 1):
                  page_text = subprocess.check_output(['pdftotext', '-f', str(page), '-l', str(page), f'report-layout-qa/{name}.pdf', '-'], text=True)
                  assert re.search(rf'{page}\s*/\s*{count}', page_text), 'Missing page number'

              assert 'Timestamp limitations:' in contents
              if name == 'demo-summary':
                  assert 'SUMMARY ONLY' in contents
              else:
                  assert 'F-001' in contents and 'F-002' in contents
          print(f'Printed {pages} readable appendix pages for 161 long-path sources')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: folder-report-print-review
          path: report-layout-qa/
